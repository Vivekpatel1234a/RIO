# Render blueprint — one-click deploy of the RIO backend (free plan).
# Dashboard: New > Blueprint > connect this repo > it reads this file.
services:
  - type: web
    name: rio-backend
    runtime: docker
    plan: free
    region: singapore            # closest to India; use frankfurt for the EU
    dockerfilePath: ./RIO-main/RIO-main/backend/Dockerfile
    dockerContext: ./            # repo root — the Dockerfile COPYs resources/
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
